[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p4mcp-server"
version = "2026.4.3078076"
description = "P4 MCP Server - Model Context Protocol server for Perforce P4 version control and P4 DAM digital asset management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Perforce Software"},
]
keywords = [
    "perforce",
    "p4",
    "mcp",
    "model-context-protocol",
    "version-control",
    "p4-dam",
    "digital-asset-management",
    "asset-review",
    "code-review",
    "game-development",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Version Control",
]

dependencies = [
    "fastmcp==3.4.4",
    "grpcio==1.81.1",
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.43.0",
    "p4python==2026.1.3027817",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "truststore==0.10.4",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
p4mcp = "p4mcp.main:main"
p4mcp-server = "p4mcp.main:main"

[project.urls]
Homepage = "https://github.com/perforce/p4mcp-server"
Repository = "https://github.com/perforce/p4mcp-server"
Issues = "https://github.com/perforce/p4mcp-server/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["p4mcp*"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt", "THIRD-PARTY-NOTICES.txt"]

[tool.pytest.ini_options]
addopts = [
    "--cov=p4mcp",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]

testpaths = [
    "tests/unittests",
]
